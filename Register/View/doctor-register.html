
<!DOCTYPE html>
<html>

<head>
    <title>DengueCare - Doctor Registration</title>
    
    <link rel="stylesheet" href="sadid.css">
</head>

<body>

    <div class="fixed-heading">
        <center>
            <h2>Doctor Registration</h2>
        </center>

        <p class="navigation" align="right">
            <a href="home.html">Registration Options</a> |
            <a href="../../Homepage/View/home.html">Home</a> |
            <a href="../../Login/View/home.html">Login</a>
        </p>
    </div>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <table>
                <tr>
                    <td><label for="fullname">Name:</label></td>
                    <td>
                        <input type="text" id="fullname" name="fullname" required>
                    </td>
                </tr>

                <tr>
    <td>Gender:</td>
    <td>
        <table>
            <tr>
                <td>
                    <input type="radio" id="gender_male"
                           name="gender" value="Male">
                    <label for="gender_male">Male</label>
                </td>
                <td>
                    <input type="radio" id="gender_female"
                           name="gender" value="Female">
                    <label for="gender_female">Female</label>
                </td>
                <td>
                    <input type="radio" id="gender_other"
                           name="gender" value="Other">
                    <label for="gender_other">Other</label>
                </td>
            </tr>
        </table>
    </td>
</tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" name="dob">
                    </td>
                </tr>

                <tr>
                    <td><label for="phone">Phone:</label></td>
                    <td>
                        <input type="tel" id="phone" name="phone" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="address">Address:</label></td>
                    <td>
                        <textarea id="address" name="address" rows="3" cols="30"></textarea>
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>Professional Information</legend>

            <table>
                <tr>
                    <td><label for="degree">Medical Degree:</label></td>
                    <td>
                        <select id="degree" name="degree" required>
                            <option value="">Select</option>
                            <option>MBBS</option>
                            <option>BDS</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="specialization">Specialization:</label></td>
                    <td>
                        <input type="text" id="specialization" name="specialization" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="bmdc">BMDC Registration Number:</label></td>
                    <td>
                        <input type="text" id="bmdc" name="bmdc" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="experience">Years of Experience:</label></td>
                    <td>
                        <input type="number" id="experience" name="experience">
                    </td>
                </tr>

                <tr>
                    <td><label for="institution">Medical Institution:</label></td>
                    <td>
                        <input type="text" id="institution" name="institution">
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>Workplace &amp; Availability</legend>

            <table>
                <tr>
                    <td><label for="workplace">Hospital / Clinic:</label></td>
                    <td>
                        <input type="text" id="workplace" name="workplace" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="chamber">Chamber Address:</label></td>
                    <td>
                        <textarea id="chamber" name="chamber" rows="3" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td><label for="consultation">Consultation Type:</label></td>
                    <td>
                        <select id="consultation" name="consultation">
                            <option value="">Select</option>
                            <option>In-person</option>
                            <option>Online</option>
                            <option>Both</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="days">Available Days:</label></td>
                    <td>
                        <input type="text" id="days" name="days">
                    </td>
                </tr>

                <tr>
                    <td><label for="hours">Available Hours:</label></td>
                    <td>
                        <input type="text" id="hours" name="hours">
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>Account Details</legend>

            <table>
                <tr>
                    <td><label for="username">Username:</label></td>
                    <td>
                        <input type="text" id="username" name="username" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="password">Password:</label></td>
                    <td>
                        <input type="password" id="password" name="password" required>
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>Confirmation</legend>

            <p>
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration">
                    I confirm that the information provided is accurate.
                </label>
            </p>

            <center>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </center>
        </fieldset>

    </form>

    <p align="center">
        Doctor details should be verified before account activation.
    </p>

</body>
</html>
